<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07070B" />
<title>Final-Bankai — Command Center</title>
<meta name="description" content="Final-Bankai — one platform, three systems, one identity." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237C5CFF'/%3E%3Cpath d='M9 9h6l3 6m-6 6a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm13 0a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm-1-5h-3a5 5 0 0 1-5-5m6 0h2l3 6.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

<!-- ============================== ICONS ============================== -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 0 1 2-2h4v7H4V6Zm8-2h6a2 2 0 0 1 2 2v4h-8V4ZM4 13h8v9H6a2 2 0 0 1-2-2v-7Zm8 0h8v7a2 2 0 0 1-2 2h-6v-9Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="4"/><path stroke-linecap="round" d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></symbol>
  <symbol id="i-hire" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path stroke-linecap="round" d="M5 21a7 7 0 0 1 14 0"/><path stroke-linecap="round" stroke-linejoin="round" d="m16 15 2 2 3-3"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><path stroke-linecap="round" d="M13 5v14"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10m5 10V4m5 16v-7m5 7V8"/></symbol>
  <symbol id="i-team" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path stroke-linecap="round" d="M5 20a7 7 0 0 1 14 0"/><path stroke-linecap="round" d="M4 6h2M18 6h2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path stroke-linecap="round" d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M12 2v3m0 14v3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M2 12h3m14 0h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" d="M6 18 18 6M6 6l12 12"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17l5-5-5-5M20 12H9M12 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path stroke-linecap="round" d="M9 8h.01M12 8h.01M15 8h.01M9 12h.01M12 12h.01M15 12h.01M10 21v-4h4v4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m0 0-6-6m6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v4m0 10v4M3 12h4m10 0h4M5.6 5.6l2.8 2.8m7.2 7.2 2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></symbol>
</svg>

<!-- ============================== CINEMATIC INTRO ============================== -->
<div id="intro" aria-hidden="true">
  <div class="in-bg"><i></i><i></i><i></i></div>
  <div class="in-grid"></div>
  <div class="in-stage">
    <div class="in-mark" id="inMark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path data-stroke stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M6.5 6h4l2.5 4.5M9 17.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm11 0a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm-2.5-2.5H14a5 5 0 0 1-5-5M13 6h2l3 6.5"/></svg>
    </div>
    <h1 class="in-word" id="inWord" aria-label="FINAL BANKAI"></h1>
    <div class="in-line"></div>
    <p class="in-sub">Command Center</p>
    <div class="in-chips">
      <span class="in-chip c1"><svg width="11" height="11" aria-hidden="true"><use href="#i-users"/></svg>Roster</span>
      <span class="in-chip c2"><svg width="11" height="11" aria-hidden="true"><use href="#i-hire"/></svg>Hiring</span>
      <span class="in-chip c3"><svg width="11" height="11" aria-hidden="true"><use href="#i-ticket"/></svg>Ticketing</span>
    </div>
  </div>
  <div class="in-progress"><i id="inBar"></i></div>
  <button class="in-skip" id="introSkip" type="button">Skip <svg width="11" height="11" aria-hidden="true"><use href="#i-arrow"/></svg></button>
  <p class="in-hint">Press any key to continue</p>
</div>

<!-- ============================== LOGIN ============================== -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M6.5 6h4l2.5 4.5M9 17.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm11 0a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm-2.5-2.5H14a5 5 0 0 1-5-5M13 6h2l3 6.5"/></svg></div>
      <div><h1>Final-Bankai</h1><p>Command Center</p></div>
    </div>
    <h2>Sign in</h2>
    <p class="hint">One identity for Roster, Hiring and Ticketing.</p>
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" type="email" autocomplete="username" placeholder="you@company.com" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
    </div>
    <p class="login-error" id="loginError" role="alert"></p>
    <button class="btn primary block" id="loginBtn" type="submit"><span class="label">Sign in</span></button>
    <p class="login-foot">Secure session · Role-based access · Audited</p>
  </form>
</section>

<!-- ============================== APP ============================== -->
<div id="app">
  <div class="overlay" id="drawerOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M6.5 6h4l2.5 4.5M9 17.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm11 0a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm-2.5-2.5H14a5 5 0 0 1-5-5M13 6h2l3 6.5"/></svg></div>
      <div><b>Final-Bankai</b><small>Command Center</small></div>
    </div>
    <div class="nav-label">Workspace</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="userAvatar">A</div>
        <div class="meta"><b id="userName">—</b><span id="userRole">—</span></div>
        <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out" style="width:30px;height:30px"><svg><use href="#i-logout"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
      <div>
        <h1 id="pageTitle">Overview</h1>
        <div class="sub" id="pageSub">Unified operations</div>
      </div>
      <div class="spacer"></div>
      <label class="search-box">
        <svg><use href="#i-search"/></svg>
        <input id="globalSearch" type="search" placeholder="Search employees, candidates, tickets…" autocomplete="off" />
      </label>
      <button class="icon-btn" id="notifBtn" style="position:relative" aria-label="Notifications">
        <svg><use href="#i-bell"/></svg>
        <span class="badge-dot" id="notifDot" hidden></span>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh"><svg><use href="#i-refresh"/></svg></button>
    </header>

    <div class="notif-panel" id="notifPanel"></div>
    <nav class="tabsbar" id="tabsbar" hidden aria-label="System sections"></nav>
    <div class="content" id="view"></div>
    <!-- persistent embedded-system stage: iframes survive navigating away -->
    <div class="sys-stage" id="sysStage" hidden><div class="sys-host" id="sysHost" hidden></div></div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
